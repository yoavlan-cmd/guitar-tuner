<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111716">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}*{box-sizing:border-box}[hidden]{display:none!important}</style>
</head>
<body>
<title>Six-String Tuner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-hand phone tool — tuning chips, a dark pedal-style display with needle, six string keys, one big listen button */
:root{
  --bg:#E8ECEA; --surface:#F7F9F8; --ink:#18201E; --muted:#5A6762; --line:#C8D1CD; --accent:#2B6A58;
  --screen:#111716; --screen-ink:#E6EFEB; --screen-dim:#56665F; --screen-line:#26302D;
  --ok:#35D592; --flat:#FFB547; --sharp:#FF7A59;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1110; --surface:#151C1A; --ink:#E2EAE6; --muted:#8B9A94; --line:#27322F; --accent:#63B89E;
  --screen:#050807; --screen-line:#1E2725; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1110; --surface:#151C1A; --ink:#E2EAE6; --muted:#8B9A94; --line:#27322F; --accent:#63B89E;
  --screen:#050807; --screen-line:#1E2725; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:14px 28px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.cal{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.cal button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.cal output{min-width:62px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;flex-direction:column;gap:7px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 14px var(--body);padding:8px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 13px var(--body);cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.screen{background:var(--screen);color:var(--screen-ink);border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--screen-line)}
.screen svg{width:100%;max-width:340px;height:auto;display:block}
.tick{stroke:var(--screen-dim);stroke-width:2;stroke-linecap:round}
.tick.major{stroke:var(--screen-ink);stroke-width:2.5}
.zone{fill:none;stroke:var(--ok);stroke-width:8;opacity:.25}
.needle{stroke:var(--screen-ink);stroke-width:3;stroke-linecap:round;transition:stroke .15s}
.hub{fill:var(--screen-ink)}
.glyph{fill:var(--screen-dim);font:600 18px var(--body)}
.screen.ok .needle,.screen.ok .hub{stroke:var(--ok);fill:var(--ok)}
.screen.ok .zone{opacity:.7}
.note{font-family:var(--display);font-weight:800;font-size:84px;line-height:.9;margin-top:-34px;display:flex;align-items:flex-start;font-variant-numeric:tabular-nums}
.note sub{font-size:26px;font-weight:600;color:var(--screen-dim);margin:44px 0 0 3px;vertical-align:baseline}
.screen.ok .note{color:var(--ok)}
.readout{display:flex;gap:18px;font-family:var(--mono);font-size:13px;color:var(--screen-dim);font-variant-numeric:tabular-nums}
.readout b{color:var(--screen-ink);font-weight:500}
.status{font:600 13px var(--body);letter-spacing:.14em;text-transform:uppercase;min-height:20px;margin-top:6px;color:var(--screen-dim)}
.status.ok{color:var(--ok)} .status.flat{color:var(--flat)} .status.sharp{color:var(--sharp)}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.str{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}
.str b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.str span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.str.target{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.str.locked{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.str.locked span{color:inherit;opacity:.8}
.str.done b::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin:3px auto 0}
.hint{font-size:12.5px;color:var(--muted);margin:0;text-align:center}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.listen{border:0;border-radius:12px;padding:15px;font:600 16px var(--body);background:var(--ink);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.listen .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.listen.on .dot{background:var(--sharp);animation:pulse 1.2s infinite}
.repeat{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:0 14px;cursor:pointer}
.repeat[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.msg{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.listen.on .dot{animation:none}.needle{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Six-String Tuner</h1>
    <div class="cal" aria-label="Reference pitch">
      <button id="calDown" aria-label="Lower A4">−</button>
      <output id="calOut">A4 440</output>
      <button id="calUp" aria-label="Raise A4">+</button>
    </div>
  </header>

  <div class="row">
    <span class="label">Guitar</span>
    <div class="seg" id="inst">
      <button data-inst="acoustic" aria-pressed="true">Acoustic</button>
      <button data-inst="electric" aria-pressed="false">Electric</button>
    </div>
  </div>

  <div class="row">
    <span class="label">Tuning</span>
    <div class="chips" id="tunings"></div>
  </div>

  <section class="screen" id="screen" aria-live="polite">
    <svg viewBox="0 0 320 172" aria-hidden="true">
      <g id="ticks"></g>
      <path class="zone" id="zone"></path>
      <text class="glyph" x="22" y="166">♭</text>
      <text class="glyph" x="288" y="166">♯</text>
      <line class="needle" id="needle" x1="160" y1="160" x2="160" y2="38"></line>
      <circle class="hub" cx="160" cy="160" r="6"></circle>
    </svg>
    <div class="note" id="note">E<sub>2</sub></div>
    <div class="readout"><span>Hz <b id="hz">—</b></span><span>Target <b id="tgt">82.41</b></span><span>Cents <b id="cents">—</b></span></div>
    <div class="status" id="status">Tap Listen or a string</div>
  </section>

  <div class="row">
    <span class="label">Strings · low to high · tap to hear, tap again to lock</span>
    <div class="strings" id="strings"></div>
  </div>

  <div class="actions">
    <button class="listen" id="listen"><span class="dot"></span><span id="listenTxt">Listen</span></button>
    <button class="repeat" id="repeat" aria-pressed="false">Repeat tone</button>
  </div>
  <p class="msg" id="msg" hidden></p>
  <p class="hint">Listening picks the closest string automatically. Lock a string to tune that one only.</p>
</div>

<script>
(()=>{
const NAMES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const TUNINGS=[
 {id:'std',name:'Standard',n:[40,45,50,55,59,64]},
 {id:'dropd',name:'Drop D',n:[38,45,50,55,59,64]},
 {id:'half',name:'Half step down',n:[39,44,49,54,58,63]},
 {id:'whole',name:'D Standard',n:[38,43,48,53,57,62]},
 {id:'dropcs',name:'Drop C♯',n:[37,44,49,54,58,63]},
 {id:'dropc',name:'Drop C',n:[36,43,48,53,57,62]},
 {id:'dropb',name:'Drop B',n:[35,42,47,52,56,61]},
 {id:'dadgad',name:'DADGAD',n:[38,45,50,55,57,62]},
 {id:'opend',name:'Open D',n:[38,45,50,54,57,62]},
 {id:'openg',name:'Open G',n:[38,43,50,55,59,62]},
 {id:'opene',name:'Open E',n:[40,47,52,56,59,64]},
 {id:'openc',name:'Open C',n:[36,43,48,55,60,64]},
];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('tuner.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('tuner.'+k,JSON.stringify(v))}catch(e){}}};

let a4=store.get('a4',440), inst=store.get('inst','acoustic');
let tuning=TUNINGS.find(t=>t.id===store.get('tuning','std'))||TUNINGS[0];
let locked=null, target=0, done=new Set();
const nm=m=>NAMES[((m%12)+12)%12], oc=m=>Math.floor(m/12)-1, fq=m=>a4*Math.pow(2,(m-69)/12);
const shortName=t=>t.n.map(nm).map(s=>s.replace('♯','#').replace('♭','b')).join('');

/* gauge */
const CX=160,CY=160,R=124,SPAN=55;
const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)]};
(()=>{let s='';for(let c=-50;c<=50;c+=5){const d=c/50*SPAN,maj=c%25===0,[x1,y1]=pt(d,maj?R-16:R-8),[x2,y2]=pt(d,R);s+=`<line class="tick${maj?' major':''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`}
 $('ticks').innerHTML=s;const [a,b]=pt(-5/50*SPAN,R+8),[c,d]=pt(5/50*SPAN,R+8);$('zone').setAttribute('d',`M${a.toFixed(1)} ${b.toFixed(1)} A${R+8} ${R+8} 0 0 1 ${c.toFixed(1)} ${d.toFixed(1)}`)})();
let needleNow=0,needleGoal=0;
function drawNeedle(){needleNow+= (needleGoal-needleNow)*0.25;$('needle').setAttribute('transform',`rotate(${(needleNow/50*SPAN).toFixed(2)} ${CX} ${CY})`)}

/* UI build */
function renderTunings(){
 $('tunings').innerHTML=TUNINGS.map(t=>`<button class="chip" data-id="${t.id}" aria-pressed="${t===tuning}">${t.name}<small>${shortName(t)}</small></button>`).join('');
}
function renderStrings(){
 $('strings').innerHTML=tuning.n.map((m,i)=>`<button class="str${i===target?' target':''}${i===locked?' locked':''}${done.has(i)?' done':''}" data-i="${i}" aria-label="String ${6-i}, ${nm(m)}${oc(m)}"><b>${nm(m)}</b><span>${6-i} · ${oc(m)}</span></button>`).join('');
}
function showTarget(){
 const m=tuning.n[target];$('note').innerHTML=`${nm(m)}<sub>${oc(m)}</sub>`;$('tgt').textContent=fq(m).toFixed(2);
}
function setTuning(t){tuning=t;store.set('tuning',t.id);locked=null;target=0;done.clear();renderTunings();renderStrings();showTarget();stopRepeat()}
$('tunings').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)setTuning(TUNINGS.find(t=>t.id===b.dataset.id))});
$('inst').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;inst=b.dataset.inst;store.set('inst',inst);[...$('inst').children].forEach(x=>x.setAttribute('aria-pressed',x===b))});
[...$('inst').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.inst===inst));
function setA4(v){a4=Math.max(430,Math.min(450,v));store.set('a4',a4);$('calOut').textContent='A4 '+a4;showTarget()}
$('calDown').onclick=()=>setA4(a4-1);$('calUp').onclick=()=>setA4(a4+1);

$('strings').addEventListener('click',e=>{const b=e.target.closest('.str');if(!b)return;const i=+b.dataset.i;
 if(locked===i)locked=null; else if(target===i&&lastTap===i)locked=i; else locked=null;
 lastTap=i;target=i;renderStrings();showTarget();pluck(fq(tuning.n[i]));if(repeatOn)startRepeat()});
let lastTap=null;

/* reference tone: Karplus-Strong pluck */
let ctx;
const getCtx=()=>{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx};
function pluck(f){
 const c=getCtx(),sr=c.sampleRate,N=Math.round(sr/f),len=Math.floor(sr*(inst==='electric'?3.6:2.6));
 const buf=c.createBuffer(1,len,sr),out=buf.getChannelData(0),d=new Float32Array(N);
 for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
 const passes=inst==='electric'?3:1;for(let p=0;p<passes;p++)for(let i=1;i<N;i++)d[i]=(d[i]+d[i-1])*.5;
 const damp=inst==='electric'?0.9985:0.9955;let p=0;
 for(let i=0;i<len;i++){out[i]=d[p];const n=(p+1)%N;d[p]=damp*.5*(d[p]+d[n]);p=n}
 const src=c.createBufferSource();src.buffer=buf;src.playbackRate.value=f/(sr/(N+0.5));
 const g=c.createGain();g.gain.setValueAtTime(inst==='electric'?0.55:0.75,c.currentTime);g.gain.setTargetAtTime(0,c.currentTime+len/sr-0.4,0.12);
 let node=src;
 if(inst==='electric'){const ws=c.createWaveShaper(),k=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;k[i]=Math.tanh(2.2*x)}ws.curve=k;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;src.connect(ws);ws.connect(lp);node=lp}
 node.connect(g);g.connect(c.destination);src.start();
}
let repeatOn=false,repTimer=null;
function startRepeat(){clearInterval(repTimer);repTimer=setInterval(()=>pluck(fq(tuning.n[target])),2400)}
function stopRepeat(){clearInterval(repTimer);repTimer=null}
$('repeat').onclick=()=>{repeatOn=!repeatOn;$('repeat').setAttribute('aria-pressed',repeatOn);if(repeatOn){pluck(fq(tuning.n[target]));startRepeat()}else stopRepeat()};

/* pitch detection */
let listening=false,stream,analyser,data,raf,hist=[],lastHeard=0,okSince=0,wake=null;
function detect(b,sr){
 let rms=0;for(let i=0;i<b.length;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);if(rms<0.012)return -1;
 let r1=0,r2=b.length-1;const th=0.2;
 for(let i=0;i<b.length/2;i++)if(Math.abs(b[i])<th){r1=i;break}
 for(let i=1;i<b.length/2;i++)if(Math.abs(b[b.length-i])<th){r2=b.length-i;break}
 const x=b.subarray(r1,r2),n=x.length,maxLag=Math.min(n-1,Math.floor(sr/55)),c=new Float32Array(maxLag+1);
 for(let l=0;l<=maxLag;l++){let s=0;for(let i=0;i<n-l;i++)s+=x[i]*x[i+l];c[l]=s}
 let d=0;while(d<maxLag&&c[d]>c[d+1])d++;
 let mv=-1,mp=-1;for(let i=d;i<=maxLag;i++)if(c[i]>mv){mv=c[i];mp=i}
 if(mp<=0||mp>=maxLag)return -1;
 const y1=c[mp-1],y2=c[mp],y3=c[mp+1],a=(y1+y3-2*y2)/2,bb=(y3-y1)/2;const T=a?mp-bb/(2*a):mp;
 return sr/T;
}
function loop(){
 raf=requestAnimationFrame(loop);analyser.getFloatTimeDomainData(data);
 const f=detect(data,ctx.sampleRate),now=performance.now();
 if(f>55&&f<1400){hist.push(f);if(hist.length>5)hist.shift();lastHeard=now;
  const med=[...hist].sort((a,b)=>a-b)[hist.length>>1];
  let i=locked;if(i==null){let best=1e9;tuning.n.forEach((m,k)=>{const cc=Math.abs(1200*Math.log2(med/fq(m)));if(cc<best){best=cc;i=k}})}
  if(i!==target){target=i;renderStrings()}
  const m=tuning.n[i],cents=1200*Math.log2(med/fq(m));
  const heard=Math.round(69+12*Math.log2(med/a4));
  $('note').innerHTML=`${nm(heard)}<sub>${oc(heard)}</sub>`;$('hz').textContent=med.toFixed(1);$('tgt').textContent=fq(m).toFixed(2);
  $('cents').textContent=(cents>0?'+':'')+cents.toFixed(0);needleGoal=Math.max(-50,Math.min(50,cents));
  const ok=Math.abs(cents)<=4,st=$('status');$('screen').classList.toggle('ok',ok);
  if(ok){st.className='status ok';st.textContent=`In tune · string ${6-i}`;if(!okSince)okSince=now;if(now-okSince>600&&!done.has(i)){done.add(i);renderStrings()}}
  else{okSince=0;const far=Math.abs(cents)>50;st.className='status '+(cents<0?'flat':'sharp');st.textContent=cents<0?(far?'Way low · tune up':'Tune up'):(far?'Way high · tune down':'Tune down')}
 }else if(now-lastHeard>500){hist=[];needleGoal=0;$('screen').classList.remove('ok');$('hz').textContent='—';$('cents').textContent='—';okSince=0;
  const st=$('status');st.className='status';st.textContent=`Play string ${6-target}`;showTarget()}
 drawNeedle();
}
async function startListening(){
 const msg=$('msg');msg.hidden=true;
 try{
  getCtx();
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=4096;data=new Float32Array(analyser.fftSize);src.connect(analyser);
  listening=true;$('listen').classList.add('on');$('listenTxt').textContent='Stop';$('status').textContent=`Play string ${6-target}`;
  try{wake=await navigator.wakeLock.request('screen')}catch(e){}
  loop();
 }catch(e){
  msg.hidden=false;msg.textContent='The microphone isn’t available on this page. Tap a string and use Repeat tone to tune by ear, or open the tuner file in Safari or Chrome to tune with the mic.';
 }
}
function stopListening(){listening=false;cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());try{wake&&wake.release()}catch(e){}
 $('listen').classList.remove('on');$('listenTxt').textContent='Listen';needleGoal=0;needleNow=0;drawNeedle();$('screen').classList.remove('ok');$('status').className='status';$('status').textContent='Tap Listen or a string';$('hz').textContent='—';$('cents').textContent='—';showTarget()}
$('listen').onclick=()=>listening?stopListening():startListening();

$('calOut').textContent='A4 '+a4;renderTunings();renderStrings();showTarget();drawNeedle();
})();
</script>

</body>
</html>
