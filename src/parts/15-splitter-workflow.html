<script type="text/plain" id="mxWf">
# Guitaring practice mixer: splits one song into parts (drums, bass, other, vocals, guitar, piano)
# with Meta's HT-Demucs 6-stem model. Installed and started by the Guitaring app. guitaring-split v7
# v4: a job can name a file in your Google Drive (drive.json) instead of carrying the song: it is fetched from Drive, and a full MP3
# and a guitars-only MP3 are saved back into the same Drive folder (and handed to the app too, in case Google's sign-in ran out).
# v5: when the song has a video (the song itself, or the video named in drive.json), a small still every 2 seconds is handed back
# with the parts (stills.bin + stills.json), so the app can check the chords against the guitarist's hand without the video.
# v6: the stills are 960 pixels wide (sharp enough to cut a close-up of the fretting hand from).
# v7: a phone-sized copy of the video (480p, video.mp4) is handed back too, for playing along with the chords in time.
# Best quality: 3 passes with small time shifts averaged together, 50% window overlap, lossless FLAC parts.
name: Split song
run-name: split ${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      id:
        description: Job id (the app uploads the song to branch j-<id>)
        required: true
permissions:
  contents: write
concurrency:
  group: split-${{ inputs.id }}
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ID: ${{ inputs.id }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: guitaring-demucs-4.1.0-torch-2.5.1
      - name: Install the separation model
        run: |
          set -o pipefail
          {
            pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install demucs==4.1.0 numpy
            which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
            python -c "import numpy, sphn, lameenc, torch, demucs.api; print('ready', torch.__version__)"
          } 2>&1 | tee -a log.txt
      - name: Get the song
        run: |
          git init -q job && cd job
          git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/j-${ID}"
          git checkout -q FETCH_HEAD
          if [ -f drive.json ]; then
            set -o pipefail
            python - <<'PY' 2>&1 | tee -a ../log.txt
          import json, urllib.request, urllib.error
          d = json.load(open('drive.json'))
          url = 'https://www.googleapis.com/drive/v3/files/%s?alt=media&supportsAllDrives=true' % d['file']
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization': 'Bearer ' + d['token']})) as r, open('song.' + d.get('ext', 'mp4'), 'wb') as f:
                  while True:
                      b = r.read(1 << 20)
                      if not b:
                          break
                      f.write(b)
          except urllib.error.HTTPError as e:
              raise SystemExit("Couldn't get the song from Google Drive (HTTP %d). Open Guitaring and send it again." % e.code)
          print('got the song from Google Drive')
          PY
          fi
          ls -la
      - name: Split it
        run: |
          f=$(ls job/song.* | head -1)
          set -o pipefail
          python -m demucs -n htdemucs_6s --shifts 3 --overlap 0.5 --flac -o out --filename "{stem}.{ext}" "$f" 2>&1 | tee -a log.txt
          mkdir res && cp out/htdemucs_6s/*.flac res/
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" || echo 0)
          echo "{\"ok\":true,\"format\":\"flac\",\"stems\":[\"drums\",\"bass\",\"other\",\"vocals\",\"guitar\",\"piano\"],\"duration\":${dur:-0}}" > res/done.json
          ls -la res
      - name: Make the MP3s and save them to Google Drive
        if: hashFiles('job/drive.json') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a log.txt
          import json, os, subprocess, urllib.request, uuid
          d = json.load(open('job/drive.json'))
          base = d.get('base') or 'Song'
          song = 'job/' + [x for x in os.listdir('job') if x.startswith('song.')][0]
          out = {'ok': True, 'files': {}}
          make = {}
          if d.get('full', True):
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', song, '-vn', '-ac', '2', '-b:a', '192k', 'res/full.mp3'], check=True)
              make['full'] = base + ' (full).mp3'
          subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', 'res/guitar.flac', '-b:a', '192k', 'res/guitars.mp3'], check=True)
          make['guitars'] = base + ' (guitars only).mp3'
          for k, name in make.items():
              try:
                  meta = json.dumps({'name': name, 'parents': [d['folder']], 'mimeType': 'audio/mpeg'}).encode()
                  bnd = 'gtr' + uuid.uuid4().hex
                  body = (b'--' + bnd.encode() + b'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta + b'\r\n--' + bnd.encode()
                          + b'\r\nContent-Type: audio/mpeg\r\n\r\n' + open('res/' + k + '.mp3', 'rb').read() + b'\r\n--' + bnd.encode() + b'--\r\n')
                  req = urllib.request.Request('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name,webViewLink',
                                               data=body, method='POST', headers={'Authorization': 'Bearer ' + d['token'], 'Content-Type': 'multipart/related; boundary=' + bnd})
                  r = json.load(urllib.request.urlopen(req))
                  out['files'][k] = {'id': r['id'], 'name': r.get('name', name), 'url': r.get('webViewLink', '')}
              except Exception as e:
                  out['ok'] = False
                  out['error'] = str(e)[:200]
          json.dump(out, open('res/drive.json', 'w'))
          print('drive', json.dumps(out)[:300])
          PY
      - name: Take stills from the video
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a log.txt
          import glob, json, os, subprocess, urllib.request
          d = json.load(open('job/drive.json')) if os.path.exists('job/drive.json') else {}
          song = 'job/' + [x for x in os.listdir('job') if x.startswith('song.')][0]
          vid = None
          if d.get('video') and d.get('video') != d.get('file'):
              vid = 'job/video.' + (d.get('vext') or 'mp4')
              req = urllib.request.Request('https://www.googleapis.com/drive/v3/files/%s?alt=media&supportsAllDrives=true' % d['video'], headers={'Authorization': 'Bearer ' + d['token']})
              with urllib.request.urlopen(req) as r, open(vid, 'wb') as f:
                  while True:
                      b = r.read(1 << 20)
                      if not b:
                          break
                      f.write(b)
          elif os.path.splitext(song)[1].lower() in ('.mp4', '.mov', '.m4v', '.webm', '.mkv'):
              vid = song
          if not vid:
              print('no video: no stills')
              raise SystemExit(0)
          has = subprocess.run(['ffprobe', '-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=codec_type', '-of', 'csv=p=0', vid], capture_output=True, text=True).stdout.strip()
          if not has:
              print('no picture in the video file: no stills')
              raise SystemExit(0)
          os.makedirs('stills', exist_ok=True)
          subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', vid, '-vf', 'fps=1/2,scale=960:-2', '-q:v', '7', 'stills/s%04d.jpg'], check=True)
          idx, o = [], 0
          with open('res/stills.bin', 'wb') as out:
              for i, f in enumerate(sorted(glob.glob('stills/*.jpg'))):
                  b = open(f, 'rb').read()
                  out.write(b)
                  idx.append([i * 2, o, len(b)])
                  o += len(b)
          json.dump({'every': 2, 'n': len(idx), 'idx': idx}, open('res/stills.json', 'w'))
          print('stills', len(idx), 'bytes', o)
          # a phone-sized copy to play along with (480p, small sound); left out if it would be too big to hand back
          r = subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', vid, '-vf', 'scale=-2:480', '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '30', '-pix_fmt', 'yuv420p',
                              '-c:a', 'aac', '-b:a', '64k', '-ac', '1', '-movflags', '+faststart', 'res/video.mp4'])
          if r.returncode != 0 or os.path.getsize('res/video.mp4') > 60 * 1024 * 1024:
              if os.path.exists('res/video.mp4'):
                  os.remove('res/video.mp4')
              print('no phone video')
          else:
              print('phone video', os.path.getsize('res/video.mp4'))
          PY
      - name: Report a failure to the app
        if: failure()
        run: |
          rm -rf res && mkdir res
          python - <<'PY'
          import json, re
          try:
              lines = [l.strip() for l in open('log.txt', errors='replace') if l.strip()]
          except Exception:
              lines = []
          lines = [l for l in lines if not re.match(r'^[\d.]+%|^\s*\|', l)]
          tail = ' / '.join(lines[-3:])[-300:]
          json.dump({"ok": False, "error": "The split failed on GitHub." + (" Last message: " + tail if tail else ""), "log": lines[-40:]}, open('res/done.json', 'w'))
          PY
      - name: Hand the parts back
        if: always()
        run: |
          cd res
          git init -q -b r
          git add -A
          git -c user.name=guitaring -c user.email=guitaring@users.noreply.github.com commit -qm "parts ${ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/r-${ID}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" --delete "j-${ID}" || true
</script>
