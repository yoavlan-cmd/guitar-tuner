function betaCopyLive(){try{const ks=[];for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i));

/* gauge */
/* ±15¢ fills most of the arc (fine tuning); 15–50¢ is squeezed into the ends so far-off strings still show */
const CX=160,CY=172,R=132,SPAN=62,FINE=.6;
const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)]};
const centsAng=c=>{const a=Math.min(50,Math.abs(c)),f=a<=15?a/15*FINE:FINE+(a-15)/35*(1-FINE);return Math.sign(c)*f*SPAN};
const arcD=(c1,c2,r)=>{const [a,b]=pt(centsAng(c1),r),[x,y]=pt(centsAng(c2),r);return `M${a.toFixed(1)} ${b.toFixed(1)} A${r} ${r} 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}`};
(()=>{let s='';const T=(c,cls,i,o)=>{const d=centsAng(c),[x1,y1]=pt(d,R-i),[x2,y2]=pt(d,R-o);return `<line class="tick${cls}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`};
 for(let c=-15;c<=15;c++){if(c%5===0)s+=T(c,c?' major':' major zero',10,c?26:30);else s+=T(c,'',10,18)}
 [-50,-30,30,50].forEach(c=>s+=T(c,' far',10,20));
 const L=(c,t)=>{const [x,y]=pt(centsAng(c),R-40);return `<text class="tlab" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle">${t}</text>`};
 s+=L(-15,'−15')+L(15,'+15')+L(-50,'−50')+L(50,'+50');

// spring-damped needle: a little overshoot and settle, like a real meter movement
let needleNow=0,needleGoal=0,needleVel=0,needleRaf=0,needleT=0;
const needleCalm=matchMedia('(prefers-reduced-motion: reduce)');
function needleStep(ts){
 const goal=centsAng(needleGoal);let dt=needleT?(ts-needleT)/1000:1/60;needleT=ts;dt=Math.min(dt,1/30);
 if(needleCalm.matches){needleNow=goal;needleVel=0}
 else for(let k=0;k<2;k++){const h=dt/2,acc=140*(goal-needleNow)-24*needleVel;needleVel+=acc*h;needleNow+=needleVel*h}
 $('needle').setAttribute('transform',`rotate(${needleNow.toFixed(2)} ${CX} ${CY})`);
 if(Math.abs(goal-needleNow)<.02&&Math.abs(needleVel)<.05){needleNow=goal;needleVel=0;needleRaf=0;needleT=0;$('needle').setAttribute('transform',`rotate(${needleNow.toFixed(2)} ${CX} ${CY})`);return}
 needleRaf=requestAnimationFrame(needleStep)}
function drawNeedle(){if(!needleRaf){needleT=0;needleRaf=requestAnimationFrame(needleStep)}}
window.__tunerTest={state:()=>({goal:needleGoal,ang:needleNow,cents:$('cents').textContent,st:$('status').textContent}),needle(c){needleGoal=c;drawNeedle()},angle:c=>centsAng(c),head:st=>setHeadState(st),done(i){done.add(i);renderStrings()}};

/* headstock: 3 pegs per side, strings fan to the nut; i=0 is the low string (string 6) */

const HSW=360,HSH=174,PEGY={top:40,bot:134};
const SUP={1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶'};
function renderStrings(){
 const all=[...HS.top.map(o=>({...o,top:true})),...HS.bot.map(o=>({...o,top:false}))];
 const peg=o=>{const i=o.str,m=tuning.n[i],sn=6-i,on=i===target,cls=`str peg${o.top?' up':' down'}${on?' target':''}${i===locked?' locked':''}${done.has(i)?' tuned':''}`;
  return `<button type="button" class="${cls}" data-i="${i}" style="left:${(o.x/HSW*100).toFixed(2)}%;top:${(PEGY[o.top?'top':'bot']/HSH*100).toFixed(2)}%" aria-pressed="${on}" aria-label="String ${sn}, ${nm(m)}${oc(m)}${i===locked?', locked':''}${done.has(i)?', in tune':''}"><b>${nm(m)}<sup>${SUP[sn]}</sup></b><i class="ok" aria-hidden="true">✓</i><span class="turn" aria-hidden="true"></span></button>`};
 const post=o=>{const y=PEGY[o.top?'top':'bot'];return `<circle class="post" cx="${o.x}" cy="${y}" r="7"/>`};
 const strLine=o=>{const i=o.str,y=PEGY[o.top?'top':'bot'],ny=NUTY[5-i];return `<path class="sline${i===target?' on':''}${done.has(i)?' fin':''}" data-s="${i}" d="M${o.x} ${y} L296 ${ny} L360 ${ny}"/>`};

  <svg class="hsart" viewBox="0 0 ${HSW} ${HSH}" aria-hidden="true">
   <defs><linearGradient id="hsWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2E34"/><stop offset=".5" stop-color="#202227"/><stop offset="1" stop-color="#17181C"/></linearGradient>

   <path class="hsbody" d="M12 87 C12 40 26 14 58 12 L262 20 Q282 22 296 52 L296 122 Q282 152 262 154 L58 162 C26 160 12 134 12 87 Z"/>

   <rect class="nut" x="296" y="54" width="6" height="66" rx="1.5" fill="url(#hsNut)"/>
   ${all.map(strLine).join('')}${all.map(post).join('')}
  </svg>${all.map(peg).join('')}</div>`;

}
function updateModeChip(){const c=$('modeChip');if(!c)return;c.textContent=locked!=null?`String ${6-locked} · ${nm(tuning.n[locked])}  ✕`:'Auto';c.classList.toggle('on',locked!=null);c.setAttribute('aria-label',locked!=null?'Tuning one string. Tap to go back to automatic':'Automatic string detection')}
function setHeadState(state,cents){
