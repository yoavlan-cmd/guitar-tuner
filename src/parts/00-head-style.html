<title>Guitaring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Chewy&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one-hand phone tool — tuning chips, a dark pedal-style display with needle, six string keys, one big listen button */
:root{
  /* Guitaring look (dark only): hardware-style dark cards, mint for what's active, amber as a second accent */
  --bg:#0F1311; --surface:#161B18; --ink:#FFFFFF; --muted:#9AA0A6; --line:rgba(255,255,255,.08); --accent:#4EE2B7; --amber:#FF8C32;
  --line-on:rgba(78,226,183,.4); --overlay:rgba(15,19,17,.75); --r-card:20px; --r-pill:9999px;
  --shadow-card:0 8px 24px rgba(0,0,0,.5); --shadow-in:inset 0 1px 2px rgba(255,255,255,.1);
  --screen:#050807; --screen-ink:#E6EFEB; --screen-dim:#56665F; --screen-line:#1E2725;
  --wood:#8A5328; --fretboard:#2B1D14; --fretwire:#C2AB82; --nut:#EFE8D8; --stringc:#D2CBBE;
  --paper:#FFFFFF; --paper-ink:#151A19; --paper-mute:#5D6964; --paper-line:#D5DCD9; --paper-note:#FFF3DC;
  --ok:#35D592; --flat:#FFB547; --sharp:#FF7A59;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:14px 28px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.cal{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.cal button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.cal output{min-width:62px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;flex:0 0 auto;border-radius:11px;display:block}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;flex-direction:column;gap:7px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 14px var(--body);padding:8px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 13px var(--body);cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.screen{background:var(--screen);color:var(--screen-ink);border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--screen-line)}
.screen svg{width:100%;max-width:250px;height:auto;display:block}
.tick{stroke:var(--screen-dim);stroke-width:2;stroke-linecap:round}
.tick.major{stroke:var(--screen-ink);stroke-width:2.5}
.zone{fill:none;stroke:var(--ok);stroke-width:8;opacity:.25}
.needle{stroke:var(--screen-ink);stroke-width:3;stroke-linecap:round;transition:stroke .15s}
.hub{fill:var(--screen-ink)}
.glyph{fill:var(--screen-dim);font:600 18px var(--body)}
.screen.ok .needle,.screen.ok .hub{stroke:var(--ok);fill:var(--ok)}
.screen.ok .zone{opacity:.7}
.note{font-family:var(--display);font-weight:800;font-size:58px;line-height:.9;margin-top:4px;display:flex;align-items:flex-start;font-variant-numeric:tabular-nums}
.note sub{font-size:26px;font-weight:600;color:var(--screen-dim);margin:44px 0 0 3px;vertical-align:baseline}
.screen.ok .note{color:var(--ok)}
.readout{display:flex;gap:18px;font-family:var(--mono);font-size:13px;color:var(--screen-dim);font-variant-numeric:tabular-nums}
.readout b{color:var(--screen-ink);font-weight:500}
.status{font:600 13px var(--body);letter-spacing:.14em;text-transform:uppercase;min-height:20px;margin-top:6px;color:var(--screen-dim)}
.status.ok{color:var(--ok)} .status.flat{color:var(--flat)} .status.sharp{color:var(--sharp)}
.strings{display:block}
.str{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}
.str b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.str span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.str.target{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.str.locked{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.str.locked span{color:inherit;opacity:.8}
.str.done b::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin:3px auto 0}
.hint{font-size:12.5px;color:var(--muted);margin:0;text-align:center}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.listen{border:0;border-radius:12px;padding:15px;font:600 16px var(--body);background:var(--ink);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.listen .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.listen.on .dot{background:var(--sharp);animation:pulse 1.2s infinite}
.repeat{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 14px var(--body);padding:0 14px;cursor:pointer}
.repeat[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg3{grid-template-columns:1fr 1fr 1fr}
.meter{position:relative;width:min(220px,70%);height:4px;border-radius:2px;background:var(--screen-line);margin-top:8px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--screen-dim);transition:width .08s linear}
.meter i.hot{background:var(--ok)}
.meter s{position:absolute;top:0;bottom:0;width:2px;background:var(--flat);left:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px var(--body);padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{display:flex;flex-direction:column;gap:14px}
.drop{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;background:var(--surface);cursor:pointer}
.drop b{font:800 24px var(--display);text-transform:uppercase;letter-spacing:.02em}
.drop span{color:var(--muted);font-size:13px;max-width:34ch}
.prog{display:flex;flex-direction:column;gap:8px}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.prog span{font-size:13px;color:var(--muted)}
.songview{display:flex;flex-direction:column;gap:14px}
.songview video{width:100%;max-height:34vh;background:#000;border-radius:12px}
.titlerow{display:flex;gap:8px;align-items:center}
.titlerow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 11px;font:500 14px var(--body)}
.chip2{flex:0 0 auto;font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.chip2:empty{display:none}
.nowrow{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.nowcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.nowcard.next{opacity:.9}
.nowcard .label b{color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:none}
.sounds{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.nbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:auto}
.nbar i{display:block;height:100%;width:0;background:var(--accent)}
.timeline{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scroll-behavior:smooth;scrollbar-width:thin}
.blk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 6px 5px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;cursor:pointer;min-width:44px}
.blk b{font:800 18px var(--display);line-height:1}
.blk span{font:400 10px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.blk.nc b{color:var(--muted)}
.blk.cur{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.blk.cur span{color:inherit;opacity:.85}
.blk.sel{box-shadow:0 0 0 2px var(--flat)}
.ctlrow{display:flex;gap:8px}
.speed{flex:1}
.editbox{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--flat);border-radius:12px;padding:10px}
.editrow{display:flex;flex-wrap:wrap;gap:6px}
select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font:500 14px var(--body)}
.btn{border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:600 14px var(--body);padding:10px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font:800 20px var(--display);text-transform:uppercase;letter-spacing:.02em}
.card p{margin:0}
.tunename{font:800 30px var(--display);line-height:1}
.tunenotes{font:500 13px var(--mono);color:var(--muted)}
.conf{display:inline-block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:middle;border:1px solid currentColor}
.conf.high{color:var(--accent)} .conf.medium{color:var(--flat)} .conf.low{color:var(--sharp)}
.tip{font-size:13.5px;color:var(--muted);line-height:1.45}
.tip b{color:var(--ink)}
.playrow{display:flex;gap:10px;flex-wrap:wrap}
.playrow label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cg{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cg small{font-size:11px;color:var(--muted);text-align:center}
.dg svg,.dgBig svg{width:100%;height:auto;display:block}
.dgBig{max-width:190px;margin:0 auto;width:100%}
#dNext{max-width:140px;margin:0 auto;width:100%}
.dgName{font:800 24px var(--display);fill:var(--ink)}
.dgLine{stroke:var(--ink);stroke-width:1.6}
.dgNut{fill:var(--ink)}
.dgMute{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.dgOpen,.dgDot{fill:var(--ink)}
.dgNum{fill:var(--surface);font:700 10px var(--body)}
.dgFret{fill:var(--muted);font:600 10px var(--body)}
.dgNone{fill:var(--muted);font:500 12px var(--body)}
.legend{font-size:12px;color:var(--muted)}
.taste{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.taste textarea{font:400 14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;text-transform:none;letter-spacing:0}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font:500 13px var(--body);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:6px 11px;text-decoration:none;background:var(--bg)}
.ai{display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.45}
.ai h3{margin:0;font:600 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ai .ver{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.ai .ver a{color:var(--accent);font-weight:600}
.nownote{margin:4px 0 0;font-size:13px;line-height:1.35;background:var(--bg);border-left:3px solid var(--flat);border-radius:4px;padding:5px 7px}
.blk.has-note{position:relative}
.blk.has-note::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--flat)}
.editbox textarea,.notes{font:400 14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;width:100%}
.liblist{display:flex;flex-direction:column;gap:6px}
.libitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%}
.libitem b{font:600 15px var(--body)}
.libitem span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:1px 6px;margin-left:6px}
.badge.old{color:var(--flat)}
.sheetview{display:flex;flex-direction:column;gap:12px}
.namefield{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.namefield input{font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;text-transform:none;letter-spacing:0}
.sheetactions{display:flex;flex-wrap:wrap;gap:6px}
.btn.danger{color:var(--sharp);border-color:var(--sharp)}
.btn.danger:not(.ghost){background:var(--sharp);color:#fff}
.draftcard{border:1px solid var(--accent);display:flex;flex-direction:column;gap:6px}.drafthead{display:flex;gap:10px;align-items:center}.draftname{margin:2px 0 0;font-size:15px}.draftcard .editrow{flex-wrap:wrap}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;background:var(--surface);border:1px solid var(--sharp);border-radius:10px;padding:10px}
.tip a{color:var(--accent);font-weight:600}
.paperwrap{overflow-x:auto;border-radius:6px;box-shadow:0 1px 0 var(--line),0 6px 24px rgba(0,0,0,.12)}
.paper{background:var(--paper);color:var(--paper-ink);padding:22px 20px 26px;font-family:var(--body);font-size:13.5px;line-height:1.45;min-width:0}
.paper.print{width:760px;padding:34px 36px 40px}
.paper h1{font:800 34px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 6px;text-wrap:balance}
.paper .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 12.5px var(--mono);color:var(--paper-mute)}
.paper .meta b{color:var(--paper-ink);font-weight:600}
.paper h3{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-mute);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--paper-line)}
.paper .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px 10px}
.paper.print .pgrid{grid-template-columns:repeat(6,1fr)}
.paper .pgrid svg{width:100%;height:auto;display:block}
.paper .prog{display:flex;flex-direction:column;gap:3px}
.paper .pl{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:baseline;padding:3px 0;border-bottom:1px dotted var(--paper-line)}
.paper .pl time{font:400 11.5px var(--mono);color:var(--paper-mute);font-variant-numeric:tabular-nums}
.paper .pl .ch{font:800 19px var(--display);letter-spacing:.02em;word-spacing:.5em}
.paper .pl .x{font:600 12px var(--mono);color:var(--paper-mute)}
.paper .pn{grid-column:2/4;font-size:12.5px;color:var(--paper-ink);background:var(--paper-note);border-radius:4px;padding:3px 7px}
.paper ul,.paper ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.paper .notes-out{white-space:pre-wrap}
.paper .foot{margin-top:22px;font-size:11px;color:var(--paper-mute)}
.textin{font:500 15px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.conf.yours{color:var(--accent)}
.tunepick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.searchrow{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:4px}
.searchrow .textin{font:500 16px var(--body);padding:11px 12px;border-radius:10px;background:var(--surface)}
.chordbook{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.bookcard{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 6px 8px;cursor:pointer;min-width:0}
.bookcard svg{width:100%;height:auto}
.bookcard small{font-size:11px;color:var(--muted);text-align:center}
.bookcard.extra{border-style:dashed;border-color:var(--accent)}
.chdetail{display:flex;flex-direction:column;gap:10px}
.chname{margin:0;font:800 40px/1 var(--display)}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.voice{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.voice svg{width:100%;height:auto}
.voice small{font-size:11.5px;color:var(--muted);font-weight:600}
.btn.cta{padding:15px;font-size:16px;background:var(--accent);color:var(--bg)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink)}
.check input{margin-top:3px;accent-color:var(--accent)}
.steps{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.steps li.ok{color:var(--ink)} .steps li.ok::marker{color:var(--accent)}
.steps li.now{color:var(--ink);font-weight:600}
.done{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px}
.done>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.done b{color:var(--accent);font:600 15px var(--body)}
.done b::before{content:"✓ "}
.done span{font-size:13px;color:var(--ink)}
.fbgrid{display:grid;grid-template-columns:1.4fr 1fr .9fr;gap:8px}
.fbgrid label,.fblabel{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;min-width:0}
.fbgrid select,.fbgrid .textin{width:100%;min-width:0}
.fblabel textarea{font:500 14px var(--mono);resize:vertical}
.hint2{font-weight:400;letter-spacing:0;font-size:12px}
.blk i{font:600 9.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-style:normal}
.blk.cur i{color:inherit}
.blk.pin b::after{content:" •";color:var(--flat)}
.paper .sec{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-mute);margin:10px 0 2px}
.screen{position:relative}
.live{position:absolute;top:10px;right:12px;display:flex;align-items:center;gap:6px;font:600 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--sharp)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--sharp);animation:pulse 1.2s infinite}
.screen.hold .needle,.screen.hold .note{opacity:.55}
.screen.hold .status{opacity:.6}
.headstock{width:100%;height:auto;display:block;overflow:visible}
.hsbody{fill:var(--wood,#7A4A26)}
.board{fill:var(--fretboard,#2B1D14)}
.fret{stroke:var(--fretwire,#B9A27A);stroke-width:2}
.nut{fill:var(--nut,#EFE8D8)}
.sline{fill:none;stroke:var(--stringc,#C9C2B4);stroke-width:1.4;opacity:.75;transition:stroke .15s,stroke-width .15s}
.sline.on{stroke:var(--accent);stroke-width:3;opacity:1}

/* ===== hardware-style tuner (dark brushed metal in light and dark mode) ===== */
#paneTune{--tm-bg:#111115;--tm-card:#1A1A1E;--tm-ink:#ECEDEF;--tm-dim:#8A8D96;--tm-line:#2A2B31;--tm-flat:#FFB74D;--tm-ok:#66BB6A;--tm-sharp:#4FC3F7}
#paneTune .screen,#paneTune .strings{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,rgba(0,0,0,.02) 1px 3px),var(--tm-card);
 border:1px solid #26272C;border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06);color:var(--tm-ink)}
#paneTune .screen{position:relative;padding:44px 14px 16px;gap:0}
#paneTune .screen svg.gauge{width:100%;max-width:330px;margin-top:-6px}
#paneTune .track{fill:none;stroke:url(#gTrack);stroke-width:9;stroke-linecap:round;opacity:.9}
#paneTune .zone{fill:none;stroke:var(--tm-ok);stroke-width:18;opacity:.0;filter:url(#gGlow);transition:opacity .2s}
#paneTune .screen.ok .zone{opacity:.55}
#paneTune .tick{stroke:#5B5E66;stroke-width:1.4;stroke-linecap:round}
#paneTune .tick.major{stroke:#B7BAC2;stroke-width:2.2}
#paneTune .tick.zero{stroke:var(--tm-ok);stroke-width:3}
#paneTune .tick.far{stroke:#6E717A;stroke-width:1.8}
#paneTune .tlab{fill:var(--tm-dim);font:600 10px var(--mono);letter-spacing:.02em}
#paneTune .nbody{fill:url(#gNeedle)}#paneTune .ntail{fill:#9AA0AA}#paneTune .nshadow{fill:#000;opacity:.35}
#paneTune .screen.ok .nbody{fill:var(--tm-ok)}
#paneTune .bezel{fill:url(#gBezel);stroke:#3A3D44;stroke-width:1}#paneTune .jewel{fill:url(#gJewel)}#paneTune .jewelhi{fill:#fff;opacity:.85}
#paneTune .fs{position:absolute;top:13px;right:16px;display:flex;gap:6px}
#paneTune .fs span{width:28px;height:24px;border-radius:8px;display:grid;place-items:center;font:700 16px var(--body);color:#5B5E66;background:#141418;border:1px solid var(--tm-line);transition:color .15s,box-shadow .15s,border-color .15s}
#paneTune #flatInd.on{color:var(--tm-flat);border-color:var(--tm-flat);box-shadow:0 0 12px rgba(255,183,77,.45)}
#paneTune #sharpInd.on{color:var(--tm-sharp);border-color:var(--tm-sharp);box-shadow:0 0 12px rgba(79,195,247,.45)}
#paneTune .mode{top:13px;left:16px;height:24px;padding:0 12px;border-radius:999px;border:1px solid #3A3C43;background:linear-gradient(#26272D,#1C1D21);color:#C9CBD1;font:700 10.5px var(--body);letter-spacing:.14em;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
#paneTune .mode.on{color:var(--tm-ok);border-color:var(--tm-ok);background:#243026}
#paneTune .live{top:17px;left:50%;right:auto;transform:translateX(-50%);color:var(--tm-ok)}#paneTune .live i{background:var(--tm-ok)}
#paneTune .note{color:var(--tm-ink);font-size:64px;margin-top:10px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#paneTune .note sub{color:var(--tm-dim);font-size:24px;margin:36px 0 0 4px}
#paneTune .screen.ok .note{color:var(--tm-ok);text-shadow:0 0 18px rgba(102,187,106,.45)}
#paneTune .status{color:var(--tm-dim);font:700 12.5px var(--body);letter-spacing:.16em;text-transform:uppercase;margin-top:6px;min-height:18px;text-align:center}
#paneTune .status.ok{color:var(--tm-ok)}#paneTune .status.flat{color:var(--tm-flat)}#paneTune .status.sharp{color:var(--tm-sharp)}
#paneTune .fine{display:none}
#paneTune .lockbadge{top:auto;bottom:62px;right:18px;width:40px;height:40px;font:800 22px/40px var(--body);background:var(--tm-ok);color:#0E1A10}
#paneTune .screen.locked{border-color:var(--tm-ok);box-shadow:0 0 0 2px var(--tm-ok),0 0 26px 3px rgba(102,187,106,.45);animation:none}

.ltxt{flex:1;min-width:0;display:flex;flex-direction:column}

.lmsg{margin:0;color:var(--muted);font-size:13px}
.libsub{margin:6px 0 0;font:600 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mxsheet{position:fixed;inset:0;z-index:70}

.mxsheet.open .mxdim{opacity:1}
.mxpanel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:80vh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
.mxsheet.open .mxpanel{transform:none}
.mxgrab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 12px}
.mxbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:60;max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 6px 22px rgba(0,0,0,.28);overflow:hidden}
.mxbar[hidden]{display:none}
.mxbar-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px 0;color:var(--ink);text-align:left;cursor:pointer}
.mxbar-ic{flex:0 0 auto}
.mxbar-tx{display:flex;flex-direction:column;min-width:0;gap:1px}
.mxbar-tx b{font:600 14px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mxbar-tx small{font:500 12px var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mxbar-play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);font-size:16px;flex:0 0 auto;cursor:pointer}
.mxbar-play[hidden]{display:none}
.mxbar-x{width:34px;height:40px;border:0;background:none;color:var(--muted);font-size:18px;flex:0 0 auto;cursor:pointer;margin-left:-2px}
.mxbar-prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);transition:width .3s}
.mxbar.work .mxbar-ic{animation:mxpulse 1.6s ease-in-out infinite}
@keyframes mxpulse{50%{opacity:.35}}
body.hasbar{padding-bottom:96px}
body.hasbar .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.toast.ok{border-color:#66BB6A;box-shadow:inset 4px 0 0 #66BB6A,0 6px 22px rgba(0,0,0,.35)}
.toast.err{border-color:#E0675F;box-shadow:inset 4px 0 0 #E0675F,0 6px 22px rgba(0,0,0,.35)}
.toast .tlink{background:none;border:0;padding:0;color:#FFB37A;text-decoration:underline;font:600 14px var(--body);cursor:pointer}
.mxmore{border-top:1px solid var(--line);padding-top:6px}

.mxmore[open] #mxLib,.mxlibwrap{display:flex;flex-direction:column;gap:10px}
.mxlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mxit{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.mxit.cur{border-color:var(--accent)}
.mxit-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;background:none;border:0;color:var(--ink);text-align:left;cursor:pointer}
.mxit-main b{font:600 14px var(--body);overflow-wrap:anywhere}
.mxit-main small{font:500 12px var(--body);color:var(--muted)}
.mxit.wait .mxit-main small,.mxit.up .mxit-main small,.mxit.get .mxit-main small{color:var(--accent)}
.mxit.failed .mxit-main small{color:#E0675F}
.mxit.ready{border-color:#66BB6A;box-shadow:inset 3px 0 0 #66BB6A}
.mxit.failed{border-color:#E0675F;box-shadow:inset 3px 0 0 #E0675F}
.mxit.failed{flex-wrap:wrap}.mxit.failed .mxit-main{flex:1 1 100%}
.mxit.failed .mxit-del{padding-top:0}.mxit.failed .mxit-del:first-of-type{margin-left:2px}
.mxit-del.mxit-fix{color:#FFB74D}
.mxit-del{background:none;border:0;color:var(--muted);padding:10px 12px;cursor:pointer;font:600 12px var(--body);flex:0 0 auto}
.mxit-del.confirm{color:#E0675F}
.mxit-retry{color:var(--accent)}
.mxlinks{display:flex;flex-wrap:wrap;gap:4px 16px}
.mxlink{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;font:500 13px var(--body);cursor:pointer;text-align:left}
.mxsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.mxsteps a{color:var(--accent)}
.mxsteps code{font:500 13px var(--mono);background:var(--bg);padding:1px 5px;border-radius:5px}
.mixview{display:flex;flex-direction:column;gap:12px}
.mixhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.mixhead b{font:700 17px var(--body);overflow-wrap:anywhere}
.mixprog{display:flex;flex-direction:column;gap:6px}.mixprog .pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.mixprog .pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.mixprog small{color:var(--muted);font-size:13px}
.mixtrans{display:flex;align-items:center;gap:10px}
.mixplay{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);font-size:22px;cursor:pointer;flex:0 0 auto}
.mixback{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 12px var(--body);cursor:pointer;flex:0 0 auto}
.mixtime{display:flex;flex-direction:column;flex:1;gap:4px;min-width:0}.mixtime input{width:100%}.mixtime small{font:500 12px var(--mono);color:var(--muted)}
.mixpre{display:flex;flex-wrap:wrap;gap:6px}
.mixrows{display:flex;flex-direction:column;gap:6px}
.mixrow{display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;gap:4px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mixrow.gtr{border-color:var(--accent)}
.mixrow b{font:600 14px var(--body)}.mixrow b small{font-weight:500;color:var(--muted);margin-left:4px}
.mixrow input[type=range],.mixtime input{accent-color:var(--accent)}.mixrow input[type=range]{grid-column:1/3;width:100%}.mixrow output{grid-column:3;font:600 12px var(--mono);color:var(--muted);min-width:40px;text-align:right}
.mixrow .ms{display:flex;gap:6px;grid-column:2/4;justify-content:flex-end}
.mixrow .ms button{min-width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 12px var(--body);cursor:pointer}
.mixrow .ms button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.mixrow.off{opacity:.5}
.mixacts{display:flex;flex-direction:column;gap:8px}
/* backup and restore */
#bkBox .btn{margin-top:8px}#bkBox label.btn{display:flex;justify-content:center;align-items:center;width:100%;box-sizing:border-box}
.bkout{font-size:14px;line-height:1.45;margin-top:8px}.bkout:empty{display:none}
.bkout .check{margin-top:8px;align-items:flex-start}.bkout .check span{display:block}
.bkerr{color:#E0675F;font-weight:600}
.bkbeta{border:1px dashed #FF6A1A;border-radius:12px;padding:8px 10px}.bkbeta .btn{display:block;margin-top:6px}
/* ===== V2 shell: header icons, bottom bar, Home, pages, onboarding ===== */
:root{--bnh:64px}
body{padding-bottom:calc(var(--bnh) + 28px + env(safe-area-inset-bottom,0px))}
/* the bottom bar sits under every overlay (they start at z-index 50); things stuck to the bottom of the page sit above it */
.wundo{bottom:calc(var(--bnh) + 10px + env(safe-area-inset-bottom,0px))}
header{align-items:center}
.hicons{display:flex;gap:2px;flex:0 0 auto}
.hic{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);padding:2px 4px;border-radius:10px;cursor:pointer;font:600 10px var(--body)}
.hic .pd{--s:30px;margin:0}.hic small{font:600 10px var(--body)}
.hic[aria-current="page"]{color:var(--ink)}.hic[aria-current="page"] .pd{box-shadow:0 0 0 2px var(--accent)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));max-width:100%}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font:600 11.5px var(--body);padding:2px 0;cursor:pointer;min-height:52px}
.bnav button .pd{--s:28px;margin:0;opacity:.75}
.bnav button[aria-current="page"]{color:var(--ink)}.bnav button[aria-current="page"] .pd{opacity:1;box-shadow:0 0 0 2px var(--accent)}
.mxbar{bottom:calc(var(--bnh) + 8px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(var(--bnh) + 12px + env(safe-area-inset-bottom,0px))}
body.hasbar{padding-bottom:calc(var(--bnh) + 96px + env(safe-area-inset-bottom,0px))}
body.hasbar .toast{bottom:calc(var(--bnh) + 76px + env(safe-area-inset-bottom,0px))}
.sech{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:2px 0 4px}
.pagebar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pagebar h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.pgback{width:40px;height:40px;flex:0 0 auto;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px var(--body);cursor:pointer;line-height:1}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.pane{display:flex;flex-direction:column;gap:12px}.pane[hidden]{display:none}
/* Home */
.homehero{border-radius:20px;padding:18px 18px 14px;color:#FFF6EA;background:radial-gradient(120% 90% at 50% 100%,#FFB02E 0%,#FF6A1A 34%,#C9301A 66%,#2A0E08 100%);display:flex;flex-direction:column;gap:10px}
.hhey{font:700 22px var(--body);margin:0}
.hjoke{font:500 16.5px/1.45 var(--body);background:rgba(20,6,2,.45);border-radius:14px;padding:14px 16px;margin:0;min-height:72px}
.hmore{align-self:flex-start;border:0;background:transparent;color:#FFF6EA;font:600 14px var(--body);padding:4px 0;cursor:pointer;opacity:.9}
.homecont{display:flex;flex-direction:column;gap:8px}.homecont:empty{display:none}
.hcont{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit}
.hcont .pd{--s:34px;margin:0}.hcont span{flex:1;min-width:0}.hcont b{display:block;font-size:15px}.hcont small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hcont i{font-style:normal;color:var(--muted);font-size:20px}
.hometiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.htile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 12px;min-height:128px;cursor:pointer;font:inherit}
.htile .pd{--s:40px;margin:0 0 6px}.htile b{font:700 16px var(--body)}.htile small{font-size:12.5px;color:var(--muted);line-height:1.3}

.jamgrid .drop.addtile{min-height:112px}
.jamlist{display:flex;flex-direction:column;gap:8px}
.jrow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px;font:inherit;cursor:pointer}
.jrow b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.jrow small{flex:0 0 auto;color:var(--muted)}
#jamBox .jrow{width:100%}.jrow.ready{border-color:#66BB6A}.jrow.failed{border-color:#E0675F}

.libnav{display:flex;flex-direction:column;gap:8px}
.libgo{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;cursor:pointer}
.libgo .pd{--s:34px;margin:0;grid-row:1/3}.libgo b{font-size:15px}.libgo small{grid-column:2;color:var(--muted);font-size:13px}.libgo i{grid-row:1/3;grid-column:3;font-style:normal;color:var(--muted);font-size:20px}
.libholder{display:flex;flex-direction:column;gap:10px}
.profconn{display:flex;flex-direction:column;gap:8px}
.profhead{display:flex;align-items:center;gap:12px}.profhead .pd{--s:40px;margin:0}.profhead b{display:block;font-size:18px}.profhead small{color:var(--muted)}
.proflist{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0;font-size:14px}.proflist dt{color:var(--muted)}.proflist dd{margin:0;min-width:0;overflow-wrap:anywhere}
.profnone{color:var(--muted);font-style:italic}
/* open lists: the title sticks to the top with a ✕, and a Close button at the bottom */
details.v2fold[open]>summary{position:sticky;top:0;z-index:4;background:var(--bg);padding-block:6px}
.ideabox.v2fold[open]>summary{background:var(--bg)}
details.v2fold[open]>summary::after{content:"✕";margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font:600 15px var(--body);color:var(--ink);background:var(--surface)}
.foldx{align-self:center;margin-top:4px}
/* onboarding */
.onb{position:fixed;inset:0;z-index:65;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.obcard{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px}
.obtop{display:flex;align-items:center;gap:12px}
.obprog{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}.obprog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.oblater{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);cursor:pointer;padding:8px 0}

.obbody{display:flex;flex-direction:column;gap:10px;font-size:15.5px;line-height:1.45;flex:1}.obbody p{margin:0}
.oblab{font-weight:700;margin-top:6px!important;display:flex;flex-direction:column;gap:6px}
.obchips{display:flex;flex-wrap:wrap;gap:8px}
.obchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:11px 16px;min-height:46px;font:600 15px var(--body);cursor:pointer}

.obsum{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.obfoot{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 2px;background:var(--bg)}.obfoot .btn{flex:1;min-height:50px}.obfoot span{flex:1}

.btn{background:var(--accent);color:var(--bg);border-radius:12px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:active,.btn.ghost:hover{border-color:var(--line-on)}
.listen{background:var(--accent);color:var(--bg)}
/* header: words, no icons */
.hicons{gap:5px}
.hic{flex-direction:row;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow-in)}
.hic small{font:600 12.5px var(--body);letter-spacing:.02em}
@media (max-width:374px){.hicons{gap:3px}.hic{padding:5px 8px}.hic small{font-size:12px}}
.hic[aria-current="page"]{color:var(--accent);border-color:var(--line-on)}
/* bottom bar: words; the current section is mint with a mint line above it */
.bnav{background:var(--surface);border-top:1px solid var(--line);padding-top:0}
.bnav button{position:relative;min-height:var(--bnh);justify-content:center;gap:3px;font:600 11.5px var(--body);letter-spacing:.03em}
.bnav button .pd{--s:28px;opacity:.7}
.bnav button[aria-current="page"] .pd{opacity:1;box-shadow:0 0 0 2px var(--accent)}
.bnav button small{font:inherit}
.bnav button[aria-current="page"]{color:var(--accent)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
/* cards */
.htile,.addgrid .drop.addtile,.libgo,.hcont,.mixrow{border-radius:var(--r-card);border:1px solid var(--line);box-shadow:var(--shadow-card)}
.libgo,.hcont{background:var(--surface)}
.htile:hover,.htile:focus-visible,.addgrid .drop.addtile:hover,.libgo:hover,.hcont:hover{border-color:var(--line-on)}
/* the feature cards: a drawn background under a dark wash, the words at the bottom */
.htile,.addgrid .drop.addtile{position:relative;overflow:hidden;justify-content:flex-end;min-height:168px;padding:20px;background-color:var(--surface);background-size:cover;background-position:center;
 background-image:linear-gradient(to bottom,rgba(15,19,17,.7),rgba(15,19,17,.9)),var(--tex,none);transition:border-color .3s}
.htile b,.addgrid .addtile b{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink);transition:color .3s}
.htile:hover b,.htile:active b,.addgrid .addtile:hover b,.addgrid .addtile:active b{color:var(--accent)}
.htile small,.addgrid .addtile .sub{font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.addgrid .addtile i:empty{display:none}
.htile[data-sec=learn],#paneSong[data-seg=learn] .addtile{--tex:var(--tex-learn)}
.htile[data-sec=write],#paneSong[data-seg=write] .addtile{--tex:var(--tex-write)}
.htile[data-sec=jam],#paneJam .addtile{--tex:var(--tex-jam)}
.htile[data-sec=gear],#paneGear .addtile{--tex:var(--tex-gear)}
.sic:empty,span.ithumb:empty,.mxbar-ic:empty{display:none}
/* I'm learning: what a song has, as short words */
.lres{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.ltag{font:600 10.5px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line-on);border-radius:var(--r-pill);padding:2px 7px;white-space:nowrap}
.ltag.none{color:var(--muted);border-color:var(--line)}
/* the player: one bar, mint play button, "Now playing", a thin progress line */
.mxbar{border-radius:var(--r-card);padding:10px 8px 12px 10px;gap:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.6);overflow:hidden}
.mxbar-play{width:48px;height:48px;background:var(--accent);color:var(--bg);font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .15s}
.mxbar-play:active{transform:scale(1.05)}
.mxbar-k{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mxbar-tx b{font:600 14px var(--body);color:var(--ink)}
.mxbar-prog{left:12px;right:auto;bottom:5px;height:3px;border-radius:3px;max-width:calc(100% - 24px)}
.mxbar::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:3px;background:rgba(0,0,0,.4);z-index:-1}
.mxbar.work .mxbar-prog{background:var(--amber)}
/* part rows: name, M and S on top, slider and % below */
.mixrows{gap:10px}
.mixrow{border-radius:16px;padding:14px 16px;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.4);gap:8px 12px}
.mixrow.gtr{border-color:var(--line-on)}
.mixrow b{font:700 14px var(--body);color:var(--ink)}
.mixrow .ms button{min-width:36px;height:28px;border-radius:7px;border:1px solid transparent;background:rgba(0,0,0,.3);color:var(--muted)}
.mixrow .ms button[data-mute].on{background:rgba(239,68,68,.2);color:#F87171;border-color:rgba(239,68,68,.4)}
.mixrow .ms button[data-solo].on{background:rgba(78,226,183,.2);color:var(--accent);border-color:var(--line-on)}
.mixrow output{font:500 12px var(--mono);color:var(--muted)}
.mixplay{width:52px;height:52px;background:var(--accent);color:var(--bg);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.mxpanel{background:var(--bg);border-color:var(--line)}
input[type=range]{accent-color:var(--accent)}
/* my learning library: status and artist filters, a status on each song */
.lstat{display:flex;gap:6px;flex-wrap:wrap}.lstat .chip small{margin-left:6px}
.lart{width:100%}
.lstate{flex:0 0 auto;font:600 10.5px var(--body);letter-spacing:.04em;text-transform:uppercase;border-radius:var(--r-pill);padding:2px 7px;color:var(--bg);background:var(--accent)}
.lstate.idea{background:transparent;color:var(--amber);border:1px solid var(--amber)}
.lstbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lstbtns button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px 4px;font:600 13px var(--body);cursor:pointer}
.lstbtns button[aria-pressed="true"]{border-color:var(--line-on);color:var(--accent);background:rgba(78,226,183,.12)}
.lrow{flex-wrap:wrap;row-gap:6px}.lrow .ltxt{min-width:55%}.lrow .lres{margin-left:auto}
.lart{font:500 14px var(--body)}
.llang button small{font:500 12px var(--mono);opacity:.75;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.iphoto0{display:grid;place-items:center;background:var(--surface)}
.gpcov{position:absolute;left:0;right:0;bottom:0;font:700 9px/14px var(--body);font-style:normal;letter-spacing:.06em;text-transform:uppercase;text-align:center;background:var(--accent);color:var(--bg)}
.gpcovbtn{margin-top:8px;width:100%}.gpcovnote{margin:8px 0 0;font:600 13px var(--body);color:var(--accent)}
/* Home fits one screen (no scrolling): the greeting, joke and Continue cards take what they need, the four tiles share the rest */
body[data-cursec=home]{height:100dvh;overflow:hidden;padding-bottom:0}
body[data-cursec=home] .wrap{height:calc(100dvh - 14px - var(--bnh) - 12px - env(safe-area-inset-bottom,0px))}
body[data-cursec=home].hasbar .wrap{height:calc(100dvh - 14px - var(--bnh) - 96px - env(safe-area-inset-bottom,0px))}
#paneHome{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0}
#paneHome .homehero{flex:0 0 auto;padding:12px 16px 8px;gap:6px}
#paneHome .hhey{font-size:19px}
#paneHome .hjoke{font-size:15px;line-height:1.4;padding:10px 14px;min-height:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#paneHome .hmore{padding:2px 0;font-size:13.5px}
#paneHome .homecont{flex:0 0 auto;gap:6px}
#paneHome .hcont{padding:8px 12px}
#paneHome .hometiles{flex:1 1 0;min-height:0;grid-template-rows:1fr 1fr}
#paneHome .htile{min-height:0;padding:14px 16px}
#paneHome .htile b{font-size:clamp(20px,6.4vw,26px)}
/* the player bar is the jam: no "Back to your jam" card while it shows; short screens keep one Continue card */
body.hasbar #paneHome .hcont.hc-jam{display:none}
@media (max-height:700px){#paneHome .hjoke{-webkit-line-clamp:3}#paneHome .htile small{-webkit-line-clamp:1}#paneHome .hcont:not(.hc-jam)~.hcont{display:none}body:not(.hasbar) #paneHome .hcont.hc-jam~.hcont{display:none}}
@media (max-height:620px){#paneHome .htile small{display:none}#paneHome .hjoke{-webkit-line-clamp:2}body.hasbar #paneHome .homecont{display:none}}
/* ===== the player: a small mixing desk ===== */
.mxpanel{background:linear-gradient(180deg,#141a17,var(--bg) 220px)}
.mixhead{align-items:flex-start}
.mixttl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mixk{display:flex;align-items:center;gap:7px;font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.mixttl b{font:800 24px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mixttl span{font:500 13.5px var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* little equalizer bars: still when paused, dancing while playing */
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{display:block;width:3px;height:30%;border-radius:1px;background:var(--accent)}
body.mxon .eq i{animation:eqb .9s ease-in-out infinite alternate}
body.mxon .eq i:nth-child(2){animation-delay:-.3s;animation-duration:.7s}body.mxon .eq i:nth-child(3){animation-delay:-.6s;animation-duration:1.1s}body.mxon .eq i:nth-child(4){animation-delay:-.15s;animation-duration:.8s}
@keyframes eqb{0%{height:20%}100%{height:100%}}
.mxbar-k{display:flex;align-items:center;gap:6px}
/* transport: the song's progress on top, then −5s · play · +5s */
.mixtrans{flex-direction:column;align-items:stretch;gap:10px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);box-shadow:var(--shadow-in)}
.mixtimes{display:flex;justify-content:space-between}.mixtimes small{font:500 12px var(--mono);color:var(--muted)}
.mixbtns{display:flex;align-items:center;justify-content:center;gap:22px}
.mixplay{width:64px;height:64px;font-size:24px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(78,226,183,.25);transition:transform .15s,box-shadow .3s}
.mixplay:active{transform:scale(.94)}
body.mxon .mixplay{box-shadow:0 0 0 6px rgba(78,226,183,.14),0 0 26px rgba(78,226,183,.45)}
.mixback{width:46px;height:46px;background:transparent;border-color:var(--line);color:var(--muted)}
/* slim custom sliders: a coloured fill up to the thumb */
#mxSeek,.strip input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:24px;margin:0;cursor:pointer}
#mxSeek{--c:var(--accent)}
#mxSeek::-webkit-slider-runnable-track,.strip input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--c) var(--p,0%),rgba(255,255,255,.12) var(--p,0%))}
#mxSeek::-moz-range-track,.strip input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
#mxSeek::-moz-range-progress,.strip input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--c)}
#mxSeek::-webkit-slider-thumb,.strip input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;border:3px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#mxSeek::-moz-range-thumb,.strip input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--c)}
/* Jamming player transport, "Fluid Pulse": a soft squircle card, the song's waveform as the seek bar with a glowing orb, the times
   under it, a glowing play button that breathes while playing, and recessed −5s / +5s with ripple rings */
.mixtrans{border:0;border-radius:30px;padding:18px 18px 22px;background:linear-gradient(160deg,#1d2226,#16191c);box-shadow:12px 12px 24px rgba(0,0,0,.5),-8px -8px 20px rgba(255,255,255,.035),inset 0 1px 0 rgba(255,255,255,.04);gap:14px}
.mixtime{position:relative;gap:6px}
.mxwave{position:relative;height:30px}
.mxwave svg{position:absolute;inset:0;width:100%;height:100%}.mxwave .w0 path{fill:#333a40}
.mxwave .w1{clip-path:inset(0 calc(100% - var(--p,0%)) 0 0)}.mxwave .w1 path{fill:var(--accent);filter:drop-shadow(0 0 4px rgba(65,226,186,.45))}
.mxorb{position:absolute;top:50%;left:var(--p,0%);width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#e9fff8;border:3px solid var(--accent);box-shadow:0 0 12px var(--accent),0 0 22px rgba(65,226,186,.5);pointer-events:none}
#mxSeek{position:absolute;left:0;right:0;top:0;height:30px;opacity:0;z-index:1}
.mixtimes small{color:var(--accent);font:600 13px var(--mono);letter-spacing:.02em}
.mixbtns{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;justify-items:center;gap:6px;padding:4px 0 26px}
.mixplay{width:76px;height:76px;font-size:26px;color:#0d1113;box-shadow:0 0 0 10px rgba(65,226,186,.06),0 0 25px rgba(65,226,186,.45)}
/* while playing, a glow ring behind the button breathes; the button itself stays still (a steady tap target) */
.mixplay{position:relative;isolation:isolate}.mixplay::before{content:'';position:absolute;inset:-12px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(65,226,186,.28) 55%,rgba(65,226,186,0) 72%);opacity:0;pointer-events:none}
body.mxon .mixplay::before{opacity:1;animation:mxbreathe 2.4s ease-in-out infinite}
@keyframes mxbreathe{0%,100%{transform:scale(.94);opacity:.55}50%{transform:scale(1.12);opacity:1}}
.mixback{width:56px;height:56px;margin-top:44px;border:0;background:#181c1f;color:#8a95a0;font:700 14px var(--body);
 box-shadow:inset 4px 4px 8px rgba(0,0,0,.55),inset -3px -3px 7px rgba(255,255,255,.05),0 0 0 9px rgba(255,255,255,.018),0 0 0 10px rgba(255,255,255,.035),0 0 0 19px rgba(255,255,255,.012),0 0 0 20px rgba(255,255,255,.028),0 0 0 29px rgba(255,255,255,.006),0 0 0 30px rgba(255,255,255,.02)}
.mixback:active{color:var(--accent);box-shadow:inset 6px 6px 10px rgba(0,0,0,.65),inset -2px -2px 5px rgba(255,255,255,.04),0 0 0 10px rgba(65,226,186,.06),0 0 0 20px rgba(65,226,186,.035),0 0 0 30px rgba(65,226,186,.02)}
.mixtime:has(#mxSeek:focus-visible) .mxorb{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){body.mxon .mixplay::before{animation:none}}
/* presets: one row that scrolls */
.mixpre{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.mixpre::-webkit-scrollbar{display:none}
.mixpre .chip{flex:0 0 auto}
/* the desk: one strip per part */
.mixrows{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;padding:12px 8px;border:1px solid var(--line);border-radius:var(--r-card);background:linear-gradient(180deg,#1a201d,#121714);box-shadow:var(--shadow-in),var(--shadow-card)}
.mixrow.strip{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 2px;border:0;border-radius:12px;background:transparent;box-shadow:none;min-width:0}
.mixrow.strip.gtr{border:0;background:rgba(78,226,183,.06)}
.strip output{font:600 11px var(--mono);color:var(--c);min-width:0;text-align:center}
.strip .fader{position:relative;width:100%;height:150px}
.strip .fader input{position:absolute;left:50%;top:50%;width:150px;transform:translate(-50%,-50%) rotate(-90deg)}
.strip .meter{position:absolute;display:block;left:calc(50% + 11px);bottom:9px;top:9px;height:calc(100% - 18px);width:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.strip .meter i{position:absolute;display:block;left:0;right:0;top:0;bottom:0;height:auto;width:auto;margin:0;border-radius:0;transform-origin:bottom;transform:scaleY(0);transition:transform .09s linear;background:linear-gradient(to top,var(--c) 0%,var(--c) 70%,#FFE27A 88%,#FF6A4D 100%)}
.strip b{font:700 11.5px var(--body);text-align:center;line-height:1.15;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.strip .ms{display:flex;flex-direction:column;gap:4px;width:100%;align-items:center}
.strip .ms button{min-width:0;width:min(36px,100%);height:26px;font-size:11.5px}
.mixrow.strip.off{opacity:.45}
.mixrows.many .strip b{font-size:10px;letter-spacing:-.01em}.mixrows.many .strip output{font-size:10px}
.mixrow.strip.off .fader input{filter:grayscale(1)}
/* ===== song session ===== */
.lrow .lgo{font-style:normal;color:var(--muted);font-size:20px;flex:0 0 auto}
.sesbox{display:flex;flex-direction:column;gap:14px}
.seshero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:var(--r-card);border:1px solid var(--line);box-shadow:var(--shadow-card);
 background-color:var(--surface);background-size:cover;background-position:center;background-image:linear-gradient(to bottom,rgba(15,19,17,.72),rgba(15,19,17,.94)),var(--tex-learn)}
.sesk{font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.seshero h3{margin:0;font:800 32px/1.02 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.sesart{margin:-4px 0 0;color:var(--muted);font:500 15px var(--body)}
.sesinfo{display:flex;flex-wrap:wrap;gap:6px}.sesinfo span{font:600 12px var(--body);color:var(--ink);background:rgba(255,255,255,.08);border-radius:var(--r-pill);padding:4px 10px}
.sestags{display:flex;flex-wrap:wrap;gap:4px}
.sesgo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:16px}
.sesgo b{font:800 20px var(--display);letter-spacing:.04em;text-transform:uppercase}.sesgo small{font:500 12.5px var(--body);opacity:.8}
.sesnone{margin:0}
.sessec h3{margin:0 0 10px;font:800 18px var(--display);letter-spacing:.04em;text-transform:uppercase}
.sessec .ldet{border:0;margin:0;padding:0;background:transparent}
.seschords{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.sesdg{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px}.sesdg svg{display:block;width:100%;height:auto}
.sesdg.none{display:grid;place-items:center;min-height:80px;background:rgba(255,255,255,.06)}.sesdg.none b{font:700 16px var(--body)}
.sesjam{display:flex;flex-wrap:wrap;gap:8px}.sesjam .btn{flex:1 1 auto}
#sesNotes{width:100%;resize:vertical;font:400 14px var(--body)}
/* Learn's two tiles line up: each title on two lines (SONG / VIDEO, CHORD / FINDER), subtitles always two lines high */
#paneSong[data-seg="learn"] .addgrid .addtile b{word-spacing:100vw}
.addgrid .addtile .sub{min-height:calc(2em * 1.35)}
/* Home tiles line up too: every title gets the same two-line box with short titles on its bottom line (JAM next to CHECK MY / GEAR) */
#paneHome .htile b{display:flex;align-items:flex-end;min-height:2.02em;line-height:1.01}
#paneHome .htile small{min-height:calc(var(--sublines,2) * 1.35em)}
@media (max-height:700px){#paneHome .htile small{--sublines:1}}
/* ===== song guide ===== */
.sesguide{display:flex;flex-direction:column;gap:12px}
.gdtabs{margin:0}.gdintro{margin:0}.gdever{margin:0}
.gdblock{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.gdblock h4{margin:0;font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.gdbig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sesguide .gdre{margin-top:10px}

.gdkara video{width:100%;height:100%;display:block;object-fit:contain;background:#000}

.gdkara .know small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.gdkara .knx em{font-style:normal;color:var(--muted);font-size:13px}

.gdkara .kctl{display:flex;gap:8px;align-items:center;margin-top:10px}.gdkara .kspeed{flex:1;grid-template-columns:repeat(3,1fr)}
.gdkara:fullscreen{background:#0d1113;padding:16px;overflow:auto}.gdkara:fullscreen .kvid{max-height:62vh;aspect-ratio:auto}
.gdsrc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.gdsrc li{display:flex;gap:8px;font-size:13.5px;line-height:1.35}.gdsrc li span{flex:0 0 16px;font-weight:800;color:var(--accent)}.gdsrc li.n{color:var(--muted)}.gdsrc li.n span{color:var(--muted)}

.gdbig b{font:800 28px/1 var(--display);letter-spacing:.02em}.gdbig small{color:var(--muted);font-size:12.5px;line-height:1.35}

.gdlv.solid{background:var(--accent);color:var(--bg)}.gdlv.likely{border:1px solid var(--amber);color:var(--amber)}.gdlv.guess{border:1px solid #FF6A4D;color:#FF8A70}
.gdpat{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.gdpat span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:10px;background:rgba(255,255,255,.04)}
